name: Maven Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and verify SBOMs
        run: mvn -B -ntp -Psbom-verifier -Dgpg.skip=true -Dmaven.javadoc.skip=true verify

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjson-sboms
          path: |
            jjson/target/bom.xml
            jjson/target/bom.json
          if-no-files-found: error
          retention-days: 14
